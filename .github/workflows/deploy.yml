name: Publicar sitio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el sitio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Construir el sitio
        run: |
          npm ci
          npm run build

      - name: Conectar con Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/627008374034/locations/global/workloadIdentityPools/github-deployments/providers/github-actions
          service_account: github-deploy@company-data-driven.iam.gserviceaccount.com

      - name: Publicar en enfermerausa.com
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: company-data-driven

      - name: Subir la versión publicada
        run: |
          # 1) Subir todo con caché larga (CSS/JS hasheados en _astro/)
          gcloud storage rsync --recursive --delete-unmatched-destination-objects dist gs://enfermerausa.com \
            --cache-control="public, max-age=31536000, immutable"
          # 2) HTML: navegador 60s (cambios visibles rápido); CDN (s-maxage) 1 día → baja TTFB
          #    Cloudflare respeta s-maxage y sirve desde el borde sin ir a GCS cada vez.
          mapfile -t HTML_OBJS < <(gcloud storage ls -r gs://enfermerausa.com/**/*.html 2>/dev/null || true)
          if [ ${#HTML_OBJS[@]} -gt 0 ]; then
            gcloud storage objects update "${HTML_OBJS[@]}" \
              --cache-control="public, max-age=60, s-maxage=86400, must-revalidate" || true
          fi
          # XML (sitemap, rss): corto — Google debe ver el sitemap actualizado, no una copia de hace un año
          mapfile -t XML_OBJS < <(gcloud storage ls "gs://enfermerausa.com/*.xml" 2>/dev/null || true)
          if [ ${#XML_OBJS[@]} -gt 0 ]; then
            gcloud storage objects update "${XML_OBJS[@]}" \
              --cache-control="public, max-age=3600, s-maxage=86400, must-revalidate" || true
          fi
          gcloud storage objects update gs://enfermerausa.com/index.html \
            --cache-control="public, max-age=60, s-maxage=86400, must-revalidate" || true
